<style>
  /* ── iOS Install Banner ───────────────────────────────────────────────── */
  #pwa-ios-banner {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 99999;
    background: #151921;
    border-top: 1px solid rgba(255,255,255,0.12);
    padding: 16px 20px 24px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.34,1.2,0.64,1);
    font-family: -apple-system, 'DM Sans', sans-serif;
  }

  #pwa-ios-banner.show { transform: translateY(0); }

  .pwa-ios-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    flex-shrink: 0;
    background: #3B82F6;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    color: white;
    overflow: hidden;
  }

  .pwa-ios-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }

  .pwa-ios-body { flex: 1; }

  .pwa-ios-title {
    font-size: 14px;
    font-weight: 700;
    color: #F8FAFC;
    margin-bottom: 4px;
  }

  .pwa-ios-msg {
    font-size: 12px;
    color: #94A3B8;
    line-height: 1.5;
  }

  .pwa-ios-msg strong { color: #F8FAFC; }

  /* The little share icon indicator */
  .pwa-ios-share {
    display: inline-block;
    width: 18px; height: 18px;
    background: #3B82F6;
    border-radius: 4px;
    text-align: center;
    line-height: 18px;
    font-size: 10px;
    color: white;
    vertical-align: middle;
  }

  .pwa-ios-close {
    background: none;
    border: none;
    color: #64748B;
    font-size: 20px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    flex-shrink: 0;
    margin-top: -2px;
  }

  /* Arrow pointing at Safari share button */
  #pwa-ios-banner::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid #151921;
  }

  /* ── Android Install Banner ───────────────────────────────────────────── */
  #pwa-android-banner {
    position: fixed;
    bottom: 24px; left: 16px; right: 16px;
    z-index: 99999;
    background: #1E232F;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 16px 18px;
    display: none;
    align-items: center;
    gap: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    font-family: -apple-system, 'DM Sans', sans-serif;
    animation: slideUpBanner 0.45s cubic-bezier(0.34,1.2,0.64,1) forwards;
  }

  @keyframes slideUpBanner {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .pwa-android-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    flex-shrink: 0;
    overflow: hidden;
  }

  .pwa-android-icon img { width: 100%; height: 100%; object-fit: cover; }

  .pwa-android-body { flex: 1; }

  .pwa-android-title {
    font-size: 14px;
    font-weight: 700;
    color: #F8FAFC;
    margin-bottom: 2px;
  }

  .pwa-android-sub {
    font-size: 11px;
    color: #64748B;
  }

  .pwa-android-btn {
    background: #3B82F6;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }

  .pwa-android-btn:active { transform: scale(0.95); }

  .pwa-android-close {

    border: none;
    color: #64748B;
    font-size: 18px;
    cursor: pointer;
    padding: 0 0 0 4px;
    flex-shrink: 0;
  }

  <style>
    /* Critical Initial Styles */
    html, body {
      margin: 0;
      padding: 0;
      background: var(--color-background, #0B0E11);
      color: var(--color-text-primary, #F8FAFC);
      font-family: 'Inter', sans-serif;
      /* We explicitly DO NOT set height here to avoid conflicts with layout.css */
    }



    /* ── SPLASH / LOADING SCREEN ──────────────────────────────────────────
       Designed to be a seamless continuation of Chrome's auto-generated
       PWA splash. Chrome shows pwa2.png centered on #0B0E11 background.
       We match that exactly, then grow the logo slightly and fade in the
       spinner — making Chrome splash → HTML splash feel like one screen. */

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Match manifest background_color exactly */
      background: var(--color-background, #0B0E11);
      transition: opacity 0.5s ease-out;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* The brand image — sized to feel intentional, not accidental */
    .loader-brand-img {
      width: min(72vw, 280px);
      height: min(72vw, 280px);
      object-fit: contain;
      /* Pulse-in: starts at Chrome's auto-splash size (~33vw), grows to 72vw */
      animation: splashGrow 0.55s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
      margin-bottom: 32px;
    }

    @keyframes splashGrow {
      from { opacity: 0.7; transform: scale(0.72); }
      to   { opacity: 1;   transform: scale(1); }
    }

    /* Thin progress line at bottom — cleaner than a spinner for a splash */
    .loader-bar-track {
      width: min(56vw, 200px);
      height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .loader-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa);
      border-radius: 2px;
      animation: barFill 1.8s ease-in-out forwards;
    }

    @keyframes barFill {
      0%   { width: 0%; }
      60%  { width: 75%; }
      90%  { width: 92%; }
      100% { width: 92%; } /* Holds — JS sets to 100% on success */
    }

    .loader-text {
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
    }

    /* Backup spinner — shown only if pwa2.png fails to load */
    .loader-spinner-fallback {
      display: none;
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 32px;
    }

    .loader-brand-img.errored + .loader-spinner-fallback { display: block; }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
